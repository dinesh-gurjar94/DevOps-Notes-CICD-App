services:
  web:
    build: .
    image: devops-notes-cicd:latest
    container_name: devops-notes-app
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      DJANGO_SECRET_KEY: "${DJANGO_SECRET_KEY:-local-demo-key-change-before-production}"
      DJANGO_DEBUG: "True"
      DJANGO_ALLOWED_HOSTS: "*"
      DB_PATH: "/app/data/db.sqlite3"
    volumes:
      - notes_data:/app/data
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health/', timeout=3)"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
volumes:
  notes_data:
